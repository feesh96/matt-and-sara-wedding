version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --global pnpm@11.9.0
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
